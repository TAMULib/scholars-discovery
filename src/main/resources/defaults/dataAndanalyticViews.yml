---
- name: Publications by Academic Age Group
  label: Scholarly Works per Author's Academic Age
  layout: CONTAINER
  type: ACADEMIC_AGE_GROUP
  filters:
    - field: class
      value: Person
  facets:
    - name: Position Titles
      field: positions
      type: STRING
      sort: COUNT
      direction: DESC
      pageSize: 10
      expandable: false
      collapsible: false
      collapsed: false
      useDialog: true
      hidden: false
    - name: Journal Titles
      field: selectedPublicationVenue
      type: STRING
      sort: COUNT
      direction: DESC
      pageSize: 10
      expandable: false
      collapsible: false
      collapsed: false
      useDialog: true
      hidden: false
    - name: Publishers
      field: selectedPublicationPublisher
      type: STRING
      sort: COUNT
      direction: DESC
      pageSize: 10
      expandable: false
      collapsible: false
      collapsed: false
      useDialog: true
      hidden: false
- name: Research by UN SDG
  label: UN SDG Impact
  layout: CONTAINER
  type: QUANTITY_DISTRIBUTION
  filters:
  - field: class
    value: Document
  facets:
    - name: UN SDG
      field: tags
      type: STRING
      sort: COUNT
      direction: DESC
      pageSize: 10
      expandable: false
      collapsible: false
      collapsed: false
      useDialog: true
      hidden: false
    - name: Year
      field: publicationDate
      opKey: BETWEEN
      type: DATE_YEAR
      sort: INDEX
      direction: DESC
      pageSize: 10
      expandable: false
      collapsible: false
      collapsed: false
      useDialog: true
      hidden: false
- name: Download Profile Summaries by Department
  label: Profile Summaries Export
  layout: CONTAINER
  type: PROFILE_SUMMARIES_EXPORT
- name: Temporal Graph
  label: Scholarly Works per Year
  layout: CONTAINER
  type: FREQUENCY_GRAPH
  filters:
  - field: class
    value: Document
  facets:
    - name: Author organization
      field: authorOrganization
      type: STRING
      sort: COUNT
      direction: DESC
      pageSize: 10
      expandable: false
      collapsible: false
      collapsed: false
      useDialog: true
      hidden: false
    - name: Authors
      field: authors
      type: STRING
      sort: COUNT
      direction: DESC
      pageSize: 10
      expandable: false
      collapsible: false
      collapsed: false
      useDialog: true
      hidden: false
