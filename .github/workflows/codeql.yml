name: "CodeQL"

on:
  push:
    branches: [ "tamu-main", *main ]
  pull_request:
    branches: [ "tamu-main" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'javascript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'adopt'
        architecture: x64
        cache: 'maven'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Start Scholars Discovery Solr Cloud
      run: docker-compose -f "solr-cloud-docker-compose.yml" up -d --build

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}

    - name: Tests with Coveralls coverage report
      run: mvn clean test jacoco:report coveralls:report -DdryRun=true

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:${{matrix.language}}"
