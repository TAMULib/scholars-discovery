name: "CodeQL"

on:
  push:
    branches: [ "tamu-main", "210-upgrade" ]
  pull_request:
    branches: [ "tamu-main", "may-2023-sprint-staging" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'adopt'
        architecture: x64
        cache: 'maven'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Start Scholars Discovery Solr Cloud
      run: docker-compose -f "solr-cloud-docker-compose.yml" up -d --build

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: 'java'

    - name: Tests with Coveralls coverage report
      run: mvn clean test jacoco:report coveralls:report -DdryRun=true

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
